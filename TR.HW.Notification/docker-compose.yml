services:
  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketreserver-notification-worker
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Development
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
      - NotificationInfrastructure__RedisConnectionString=${REDIS_HOST:-redis}:6379,abortConnect=false
      - KafkaConsumer__BootstrapServers=kafka:9092
      - KafkaConsumer__Topics__0=ticketing.v1.issued
      - KafkaConsumer__Topics__1=payment.v1.refunded
      - KafkaConsumer__Topics__2=payment.v1.declined
      - KafkaConsumer__GroupId=cg-notification-worker
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ticketreserver-internal-net
