services:
  debezium:
    image: debezium/connect:2.5.4.Final
    container_name: ticketreserver-debezium
    restart: unless-stopped
    ports:
      - "${DEBEZIUM_PORT:-8083}:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=debezium_configs
      - OFFSET_STORAGE_TOPIC=debezium_offsets
      - STATUS_STORAGE_TOPIC=debezium_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - ENABLE_DEBEZIUM_SCRIPTING=false
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ticketreserver-internal-net

  debezium-init:
    image: curlimages/curl:8.6.0
    container_name: ticketreserver-debezium-init
    restart: "no"
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./docker/debezium/register-connector.sh:/register-connector.sh:ro
      - ./docker/debezium/debezium-postgres-catalog.json:/debezium-postgres-catalog.json:ro
    entrypoint: ["/bin/sh", "-c", "/register-connector.sh"]
    environment:
      - CONNECT_URL=http://debezium:8083
      - CONNECTOR_CONFIG=/debezium-postgres-catalog.json
    networks:
      - ticketreserver-internal-net
