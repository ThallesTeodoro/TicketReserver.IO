services:
  postgres:
    image: postgres:16-alpine
    container_name: tr-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - tr-postgres-data:/var/lib/postgresql/data
    networks:
      - ticketreserver-net

  redis:
    image: redis/redis-stack:latest
    container_name: tr-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    networks:
      - ticketreserver-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: tr-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9092:9092"
    networks:
      - ticketreserver-net

  akhq:
    image: tchiotludo/akhq:latest
    container_name: tr-akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:29092"
    ports:
      - "8085:8080"
    networks:
      - ticketreserver-net
    depends_on:
      - kafka

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: tr-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/docker/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter
    networks:
      - ticketreserver-net
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:latest
    container_name: tr-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/docker/loki/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - ticketreserver-net

  tempo:
    image: grafana/tempo:latest
    container_name: tr-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/docker/tempo/tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # HTTP
      - "4317"      # OTLP gRPC (internal)
    networks:
      - ticketreserver-net

  prometheus:
    image: prom/prometheus:latest
    container_name: tr-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ticketreserver-net

  grafana:
    image: grafana/grafana:latest
    container_name: tr-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - ticketreserver-net
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  ticketreserver-net:
    driver: bridge

volumes:
  tr-postgres-data:
