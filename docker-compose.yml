include:
  - ./docker/redis/docker-compose.yml
  - ./docker/kafka/docker-compose.yml
  - ./TR.API.Events/docker-compose.yml
  - ./TR.API.Reservation/docker-compose.yml
  - ./TR.HW.ReservationOutboxRelay/docker-compose.yml
  - ./TR.HW.ResTimeout/docker-compose.yml
  - ./TR.HW.Payment/docker-compose.yml
  - ./TR.HW.Ticketing/docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketreserver-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-catalog_events_db}
    ports:
      - "${EVENTS_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-events-db.sql:/docker-entrypoint-initdb.d/01-init-events-db.sql:ro
      - ./docker/postgres/init-reservation-db.sql:/docker-entrypoint-initdb.d/02-init-reservation-db.sql:ro
      - ./docker/postgres/init-payment-db.sql:/docker-entrypoint-initdb.d/03-init-payment-db.sql:ro
      - ./docker/postgres/init-ticketing-db.sql:/docker-entrypoint-initdb.d/04-init-ticketing-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-catalog_events_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ticketreserver-internal-net

volumes:
  postgres_data:
    driver: local

networks:
  ticketreserver-internal-net:
    name: ticketreserver-internal-net
    driver: bridge
