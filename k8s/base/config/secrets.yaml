apiVersion: v1
kind: Secret
metadata:
  name: ticketreserver-secrets
  labels:
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: configuration
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_USER: "postgres"
  ConnectionStrings__EventsDb: "Host=postgres-service;Port=5432;Database=catalog_events_db;Username=postgres;Password=postgres"
  ConnectionStrings__ReservationDb: "Host=postgres-service;Port=5432;Database=reservation_db;Username=postgres;Password=postgres"
  ConnectionStrings__PaymentDb: "Host=postgres-service;Port=5432;Database=payment_db;Username=postgres;Password=postgres"
  ConnectionStrings__TicketingDb: "Host=postgres-service;Port=5432;Database=ticketing_db;Username=postgres;Password=postgres"
