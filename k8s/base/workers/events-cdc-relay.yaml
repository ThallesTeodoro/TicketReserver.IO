apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-cdc-relay
  labels:
    app.kubernetes.io/name: events-cdc-relay
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: events-cdc-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events-cdc-relay
        app.kubernetes.io/part-of: ticketreserver
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: events-cdc-relay
          image: ticketreserver/tr-hw-notification:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ticketreserver-common-config
            - secretRef:
                name: ticketreserver-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "notification-worker"
            - name: KafkaConsumer__BootstrapServers
              value: "kafka-service:9094"
            - name: KafkaConsumer__GroupId
              value: "cg-notification-worker"
            - name: KafkaConsumer__Topics__0
              value: "ticketing.v1.issued"
            - name: KafkaConsumer__Topics__1
              value: "payment.v1.refunded"
            - name: KafkaConsumer__Topics__2
              value: "payment.v1.declined"
            - name: NotificationInfrastructure__RedisConnectionString
              value: "redis-service:6379,abortConnect=false"
          resources:
            requests:
              cpu: "30m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
