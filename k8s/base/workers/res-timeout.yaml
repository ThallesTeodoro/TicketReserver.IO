apiVersion: apps/v1
kind: Deployment
metadata:
  name: res-timeout-worker
  labels:
    app.kubernetes.io/name: res-timeout-worker
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: res-timeout-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: res-timeout-worker
        app.kubernetes.io/part-of: ticketreserver
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: res-timeout-worker
          image: ticketreserver/tr-hw-res-timeout:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ticketreserver-common-config
            - secretRef:
                name: ticketreserver-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "res-timeout-worker"
            - name: Kafka__BootstrapServers
              value: "kafka-service:9094"
            - name: Kafka__Topic
              value: "reservation.v1.hold_created.delayed"
            - name: Kafka__GroupId
              value: "cg-reservation-timeout"
            - name: Kafka__DeadLetterQueueTopic
              value: "reservation.v1.hold_created.delayed.DLQ"
          resources:
            requests:
              cpu: "30m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
