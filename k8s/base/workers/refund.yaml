apiVersion: apps/v1
kind: Deployment
metadata:
  name: refund-worker
  labels:
    app.kubernetes.io/name: refund-worker
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: refund-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: refund-worker
        app.kubernetes.io/part-of: ticketreserver
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: refund-worker
          image: ticketreserver/tr-hw-refund:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ticketreserver-common-config
            - secretRef:
                name: ticketreserver-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "refund-worker"
            - name: Database__ConnectionString
              value: "Host=postgres-service;Port=5432;Database=payment_db;Username=postgres;Password=postgres"
            - name: Kafka__BootstrapServers
              value: "kafka-service:9094"
            - name: Kafka__PaymentRefundedTopic
              value: "payment.v1.refunded"
            - name: Kafka__DeadLetterQueueTopic
              value: "ticketing.v1.failed.DLQ"
            - name: KafkaConsumer__BootstrapServers
              value: "kafka-service:9094"
            - name: KafkaConsumer__Topic
              value: "ticketing.v1.failed"
            - name: KafkaConsumer__GroupId
              value: "cg-payment-refund"
            - name: KafkaConsumer__DeadLetterQueueTopic
              value: "ticketing.v1.failed.DLQ"
            - name: PaymentGateway__Provider
              value: "STRIPE"
            - name: PaymentGateway__SimulateSuccess
              value: "true"
          resources:
            requests:
              cpu: "30m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
