apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-api
  labels:
    app.kubernetes.io/name: events-api
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: events-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events-api
        app.kubernetes.io/part-of: ticketreserver
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: events-api
          image: ticketreserver/tr-api-events:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ticketreserver-common-config
            - secretRef:
                name: ticketreserver-secrets
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: events-api
  labels:
    app.kubernetes.io/name: events-api
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: events-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
