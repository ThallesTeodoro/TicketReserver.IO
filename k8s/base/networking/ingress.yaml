apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketreserver-ingress
  labels:
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,traceparent,tracestate,X-Request-ID"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: events-api
                port:
                  number: 8080
          - path: /venues
            pathType: Prefix
            backend:
              service:
                name: events-api
                port:
                  number: 8080
          - path: /reserva
            pathType: Prefix
            backend:
              service:
                name: reservation-api
                port:
                  number: 8080
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: search-api
                port:
                  number: 8080
          - path: /api/v1/search
            pathType: Prefix
            backend:
              service:
                name: search-api
                port:
                  number: 8080
