apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: external-service
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
