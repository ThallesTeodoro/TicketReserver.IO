apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-worker-scaledobject
  labels:
    app.kubernetes.io/name: payment-worker
    app.kubernetes.io/part-of: ticketreserver
    app.kubernetes.io/component: keda-autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-worker
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 15
  cooldownPeriod: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-service:9094
        consumerGroup: cg-payment-processing
        topic: reservation.v1.checkout_req
        lagThreshold: "30"
---
