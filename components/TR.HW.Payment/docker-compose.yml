services:
  payment-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketreserver-payment-worker
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Development
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
      - Database__ConnectionString=Host=postgres;Port=5432;Database=payment_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__PaymentApprovedTopic=payment.v1.approved
      - Kafka__PaymentDeclinedTopic=payment.v1.declined
      - Kafka__DeadLetterQueueTopic=payment.v1.checkout_req.DLQ
      - KafkaConsumer__BootstrapServers=kafka:9092
      - KafkaConsumer__Topic=reservation.v1.checkout_req
      - KafkaConsumer__GroupId=cg-payment-processing
      - KafkaConsumer__DeadLetterQueueTopic=reservation.v1.checkout_req.DLQ
      - PaymentGateway__Provider=STRIPE
      - PaymentGateway__SimulateSuccess=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=payment-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ticketreserver-internal-net
